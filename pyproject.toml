[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stemma-protocol"
version = "0.1.0"
description = "Lineage infrastructure for agentic systems: continuity without captivity."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Sarasha Elion"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/stemma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
